tools:
- name: opsera_groups
  description: 'Group management: list, get, create, delete, get_memberships, add/remove/patch members.
    See docs/API_REFERENCE.md.'
- name: opsera_insights
  description: 'Insights: dashboards, filters, audit logs, KPIs, tool mappings. See docs/API_REFERENCE.md
    for all operations.'
- name: opsera_mappings
  description: 'Data mappings: list, get, create, update. See docs/API_REFERENCE.md.'
- name: opsera_pipeline_parameters
  description: 'Pipeline parameters: reusable, configurable key-value pairs scoped to a pipeline. Parameters
    can be referenced by pipeline steps during execution for dynamic configuration (environment variables,
    secrets, build flags, deployment targets). Use list to see all parameters for a pipeline before triggering
    a run. Use create/update to set runtime values. Use get_value for lightweight value retrieval. Parameter
    types: string (default), number, boolean, secret (masked in logs). See docs/API_REFERENCE.md.'
- name: opsera_pipelines
  description: 'Pipelines: monitor runs, security audit, run duration stats, configuration, templates,
    and lifecycle actions. Execution questions (image tag, artifact, commit SHA): list_runs then get_run
    (view=artifacts by default). Do not call get afterward. security_audit: find pipelines with disabled
    security steps; set includeStats=true to include each pipeline average/min/max run duration. runs_stats:
    average/min/max run duration for one pipelineId or batch pipelineIds (no security filter). get with
    view=security audits one known pipeline; get without view is full config (large). list is a lightweight
    catalog. list_runs is recent run timing. action runs mutations. See docs/API_REFERENCE.md.'
- name: opsera_projects
  description: 'Projects: list, get, create, update. See docs/API_REFERENCE.md for operations.'
- name: opsera_reports_and_logs
  description: 'Reports and logs: reports_tasks_created, reports_pipelines_created, logs_audit_user, logs_task.
    See docs/API_REFERENCE.md.'
- name: opsera_search_data_settings
  description: Cross-entity discovery and platform settings. search finds pipeline, task, or registry
    records by name or ID and returns lightweight metadata only — not execution history, artifacts, durations,
    or full stage configuration (use opsera_pipelines for those). org_hierarchy and settings_tasks for
    organizational mapping and task configuration updates. See docs/API_REFERENCE.md.
- name: opsera_tasks
  description: 'Tasks: list, create, status, lookup; lifecycle mutations via operation=action (run, stop,
    create, update, status). See docs/API_REFERENCE.md.'
- name: opsera_tools
  description: 'Tools & registry: identifiers, registry, scm_repositories, scm_branches, registry_configurations.
    See docs/API_REFERENCE.md.'
- name: opsera_users
  description: 'User management: get_current, get, list (optional active=true|false), create, delete.
    See docs/API_REFERENCE.md.'
